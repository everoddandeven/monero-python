        - 'api/data_model/wallet/index.md'
        - Configurations and Queries: 'api/data_model/wallet/inputs.md'
        - Accounts and Addresses: 'api/data_model/wallet/accounts.md'
        - Transactions, Transfers and Outputs: 'api/data_model/wallet/transactions.md'
