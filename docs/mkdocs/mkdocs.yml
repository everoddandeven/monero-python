# Project information
site_name: Monero Python
site_description: 'Monero Python API Documentation'
site_author: "Libmonero"
site_url: 'https://libmonero.github.io/monero-python/'
site_dir: 'public'

# a link to a page, a file or an anchor that does not exist is a warning, which fails the strict build
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

copyright: '© 2026 Libmonero under <a href="https://opensource.org/licenses/MIT">MIT</a>'

nav:
- Home: 'index.md'
- Getting Started:
  - Installation: 'getting_started/installation.md'
  - Build from Source:
    - Linux and macOS: 'getting_started/build_linux_macos.md'
    - Debian Package: 'getting_started/build_debian.md'
    - Windows: 'getting_started/build_windows.md'
- Documentation:
  - Architecture: 'api/architecture.md'
  - API Reference:
    - Serializable Struct: 'api/serializable_struct.md'
    - Errors: 'api/errors.md'
    - Connection:
      - Data Model: 'api/data_model/connection.md'
      - RPC: 'api/connection.md'
    - Daemon:
      - Data Model:
        - 'api/data_model/daemon/index.md'
        - Blocks and the Chain: 'api/data_model/daemon/blocks.md'
        - Transactions and Outputs: 'api/data_model/daemon/transactions.md'
        - The Daemon and its Network: 'api/data_model/daemon/network.md'
        - Mining: 'api/data_model/daemon/mining.md'
      - Interface: 'api/daemon.md'
      - RPC: 'api/daemon_rpc.md'
    - Wallet:
