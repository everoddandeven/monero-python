      - Interface: 'api/wallet.md'
      - RPC: 'api/wallet_rpc.md'
      - Full: 'api/wallet_full.md'
      - Keys-Only: 'api/wallet_keys.md'
      - Support: 'api/wallet_support.md'
    - Utils: 'api/utils.md'
  - Glossary: 'api/glossary.md'
  - Security: 'api/security.md'
  - Troubleshooting: 'api/troubleshooting.md'
- Examples:
