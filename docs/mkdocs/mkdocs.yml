  - Development Setup: 'contributing/development.md'
  - Making a Change: 'contributing/changes.md'
  - Writing the Docs: 'contributing/docs.md'
  - Commits and Pull Requests: 'contributing/commits.md'
  - Continuous Integration: 'contributing/ci.md'
  - Releases: 'contributing/releases.md'
# the notes of each release are the ones that GitHub generates for it (release.yml), they are not copied here
- Changelog: 'https://github.com/libmonero/monero-python/releases'


theme:
  name: material
  custom_dir: overrides
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono
  favicon: images/favicon.ico
  icon:
    logo: logo
  logo: 'images/monero.svg'
  static_templates:
    - 404.html

extra_css:
  - overrides.css

extra_javascript:
  # the entries of the navigation that leave the site (the Changelog) open in a new tab
  - external_links.js

extra:
  social:
    - icon: material/web
      link: https://docs.getmonero.org
      name: Clearnet Website
    - icon: fontawesome/brands/github
      link: https://github.com/libmonero/monero-python
      name: GitHub Repository
    - icon: simple/matrix
      link: https://matrix.to/#/%23monero-python:monero.social
      name: Matrix

repo_name: 'libmonero/monero-python'
repo_url: 'https://github.com/libmonero/monero-python'
edit_uri: edit/main/docs/mkdocs/docs/

markdown_extensions:
  # https://squidfunk.github.io/mkdocs-material/reference/admonitions/
  - admonition
  - abbr
  - def_list
  - attr_list
  - md_in_html                  # markdown inside html blocks: the grid cards of the home page
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.highlight:
      use_pygments: true         # build time highlighting, not client side
  - pymdownx.inlinehilite
  - pymdownx.superfences:        # nest code blocks inside codeblocks
      # the diagrams of the pages, in ```mermaid blocks, which Material draws
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:           # insert content from other files
      # the root of the repository: the getting started pages include sections of README.md, the one place that has them
      base_path: [!relative $config_dir/../..]
      # a file or a section that is not there fails the build
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables

plugins:
  - search
  - minify:
      minify_html: true
      minify_js: true
      htmlmin_opts:
        remove_comments: true
  - privacy
  - macros:
      include_dir: docs/macros/includes
      # the variables of variables.py, as the commit that the site is built from
      module_name: variables
      # a variable or a key that does not exist is an error, which fails the build: not a "{{ no such element }}" in the page
      on_undefined: strict
      # the support matrix of the wallets, which tests/wallet/test_support.py checks against the bindings
      include_yaml:
        - wallet_support: ../../tests/wallet/wallet_support.yml
  - mkdocstrings:
      handlers:
        python:
          # the stubs of src/monero, the package that they describe: mkdocstrings reads them without
          # importing anything, there is no need to build or install the module
          paths: [../../src]
          options:
            extensions:
              # the links of reStructuredText in the docstrings of the stubs, as links of Markdown
              - griffe_rst_links.py
              # the functions that only have overloads in the stubs, which griffe leaves out
              - griffe_overloads.py
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            docstring_style: sphinx
            merge_init_into_class: false
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
