[pytest]
minversion = 9.0
required_plugins = pytest-rerunfailures pytest-timeout pytest-cov
addopts = -s -v --reruns 5 --reruns-delay 10 --only-rerun "Daemon is busy"
timeout = 900
log_level = INFO
log_cli = True
log_cli_level = INFO
console_output_style = progress
log_file = test_logs/monero_tests_python.log
log_file_level = DEBUG
log_file_format = %(asctime)s %(levelname)-8s %(name)s:%(lineno)s %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
testpaths =
    tests
markers =
    unit: fast unit tests, no external dependencies
    integration: slow integration tests, requires external services
    wallet_full: tests of the full wallet, added to the classes of each wallet type by tests/wallet/conftest.py
    wallet_rpc: tests of the rpc wallet
    wallet_keys: tests of the keys-only wallet
    wallet_light: tests of the light wallet
    not_supported: inherited test whose operation is permanently unsupported for this type; passes when it raises a "not supported" error, fails otherwise
    not_implemented: inherited test whose operation is not implemented yet; applied as a strict xfail (xfails while it raises, fails once the feature lands, so that the marker is removed)
