[project]
name = "monero"
# the only place where the version is declared: CMakeLists.txt, debian/set-version.sh and
# the release workflow read it from here
version = "0.9.11"
description = "A Python library for using Monero"
authors = [
    { name = "Libmonero", email = "libmonero@protonmail.com" }
]
maintainers = [
    { name = "everoddandeven", email = "everoddandeven@protonmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["monero", "xmr", "cryptocurrency", "wallet", "daemon", "rpc", "bindings"]
classifiers = [
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    # the versions that the module is built for: the deb packages of jammy (3.10), bookworm (3.11), noble (3.12) and trixie
    # (3.13), the wheels of Windows (3.13) and macOS (3.14)
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Security :: Cryptography",
    # the stubs of src/monero, with py.typed
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/libmonero/monero-python"
Documentation = "https://libmonero.github.io/monero-python/"
Issues = "https://github.com/libmonero/monero-python/issues"
Changelog = "https://github.com/libmonero/monero-python/releases"

[build-system]
requires = [
    # 0.11 for the license as an SPDX expression (PEP 639)
    "scikit-build-core>=0.11",
    "pybind11>=2.12,<3",
    "cmake>=3.20",
    "ninja"
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
build.verbose = true
cmake.build-type = "Release"
