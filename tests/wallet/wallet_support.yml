# Which wallet implements which method of MoneroWallet: the "Wallet support" page of the docs is made from this file, by section and in
# this order. tests/wallet/test_support.py calls every method on a full, an rpc and a keys-only wallet, and fails when this file says
# otherwise, so a change of the bindings comes with its change here.
#
#   supported    the wallet implements it
#   partial      the wallet implements some of its overloads: the note says which
#   todo         the wallet does not implement it yet, and it will
#   unsupported  the wallet does not implement it: what it is made on can not do it
#
# The calls only tell implemented from not, todo and unsupported are the same to the test: which one is written here.

