services:

  # The dev container is not used, it is just handy to run `docker-compose up dev` to start all services
  dev:
    image: alpine:3.22.1
    container_name: dev
    command: [ "/bin/sh", "-c", "trap : TERM INT; while :; do echo Ready to code and debug like a rockstar!!!; sleep 2073600; done & wait" ]
    depends_on:
      - node_2
      - xmr_wallet_1
      - xmr_wallet_2
      - xmr_wallet_3
      - xmr_lws

  node_1:
    image: lalanza808/monero:v0.18.5.0
    container_name: node_1
    command: [
      "monerod",
      "--fixed-difficulty=500",
      "--log-level=3",
      "--p2p-bind-ip=0.0.0.0",
      "--p2p-bind-port=48080",
      "--rpc-bind-port=18089",
      "--rpc-bind-ip=0.0.0.0",
      "--rpc-access-control-origins=*",
      "--rpc-ssl=disabled",
      "--rpc-login=rpc_daemon_user:abc123",
      "--rpc-max-connections-per-private-ip=100",
      "--disable-rpc-ban",
      "--confirm-external-bind",
      "--add-exclusive-node=node_2:18080",
      "--regtest",
      "--hide-my-port",
      "--no-zmq",
      "--max-connections-per-ip=100",
      "--non-interactive"
    ]
    volumes:
      - xmr_node_1_data:/data
    ports:
      - "48080:48080"
      - "18089:18089"
    restart: on-failure

  node_2:
    image: lalanza808/monero:v0.18.5.0
    container_name: node_2
    command: [
      "monerod",
      "--fixed-difficulty=500",
      "--log-level=3",
      "--p2p-bind-ip=0.0.0.0",
      "--p2p-bind-port=18080",
      "--rpc-bind-ip=0.0.0.0",
      "--rpc-bind-port=18081",
      "--rpc-access-control-origins=*",
      "--rpc-ssl=disabled",
      "--rpc-max-connections-per-private-ip=100",
      "--rpc-login=rpc_daemon_user:abc123",
      "--zmq-rpc-bind-ip=0.0.0.0",
      "--zmq-rpc-bind-port=18085",
      "--zmq-pub=tcp://0.0.0.0:18086",
      "--disable-rpc-ban",
      "--confirm-external-bind",
      "--confirm-zmq-rpc-external-bind",
      "--add-exclusive-node=node_1:48080",
      "--regtest",
      "--hide-my-port",
      "--max-connections-per-ip=100",
      "--non-interactive"
    ]
    volumes:
      - xmr_node_2_data:/data
    ports:
      - "18080:18080"
      - "18081:18081"
      - "18085:18085"
      - "18086:18086"
    depends_on:
      - node_1
    restart: on-failure

  xmr_wallet_1:
    image: lalanza808/monero:v0.18.5.0
    container_name: xmr_wallet_1
    command: [
      "monero-wallet-rpc",
      "--log-level=3",
      "--allow-mismatched-daemon-version",
      "--rpc-bind-ip=0.0.0.0",
      "--confirm-external-bind",
      "--rpc-bind-port=18082",
      "--trusted-daemon",
      "--daemon-address=node_2:18081",
      "--daemon-login=rpc_daemon_user:abc123",
      "--rpc-login=rpc_user:abc123",
      "--rpc-max-connections-per-private-ip=100",
      "--wallet-dir=/wallet",
      "--rpc-access-control-origins=*",
      "--non-interactive"
    ]
    ports:
      - "18082:18082"
    volumes:
      - xmr_wallet_1_data:/wallet
    depends_on:
      - node_1
      - node_2

  xmr_wallet_2:
    image: lalanza808/monero:v0.18.5.0
    container_name: xmr_wallet_2
    command: [
      "monero-wallet-rpc",
      "--log-level=3",
      "--allow-mismatched-daemon-version",
      "--rpc-bind-ip=0.0.0.0",
      "--confirm-external-bind",
      "--rpc-bind-port=18083",
      "--trusted-daemon",
      "--daemon-address=node_2:18081",
      "--daemon-login=rpc_daemon_user:abc123",
      "--rpc-login=rpc_user:abc123",
      "--rpc-max-connections-per-private-ip=100",
      "--wallet-dir=/wallet",
      "--rpc-access-control-origins=*",
      "--non-interactive"
    ]
    ports:
      - "18083:18083"
    volumes:
      - xmr_wallet_2_data:/wallet
    depends_on:
      - node_1
      - node_2

  xmr_wallet_3:
    image: lalanza808/monero:v0.18.5.0
    container_name: xmr_wallet_3
    command: [
      "monero-wallet-rpc",
      "--log-level=3",
      "--allow-mismatched-daemon-version",
      "--rpc-bind-ip=0.0.0.0",
      "--confirm-external-bind",
      "--rpc-bind-port=18084",
      "--trusted-daemon",
      "--daemon-address=node_2:18081",
      "--daemon-login=rpc_daemon_user:abc123",
      "--rpc-login=rpc_user:abc123",
      "--rpc-max-connections-per-private-ip=100",
      "--wallet-dir=/wallet",
      "--rpc-access-control-origins=*",
      "--non-interactive"
    ]
    ports:
      - "18084:18084"
    volumes:
      - xmr_wallet_3_data:/wallet
    depends_on:
      - node_1
      - node_2

  xmr_lws:
    image: vtnerd/monero-lws:1.0
    container_name: xmr_lws
    command: >
      --daemon=tcp://node_2:18085
      --sub=tcp://node_2:18086
      --log-level=4
      --webhook-ssl-verification=none
      --disable-admin-auth
      --rest-server=http://0.0.0.0:8443/
      --access-control-origin=*
      --confirm-external-bind
      --max-subaddresses=200
      --auto-accept-creation
      --regtest
    volumes:
      - xmr_lws_data:/data
    ports:
      - "8443:8443"
    depends_on:
      - node_1
      - node_2

volumes:
  xmr_node_1_data:
  xmr_node_2_data:
  xmr_wallet_1_data:
  xmr_wallet_2_data:
  xmr_wallet_3_data:
  xmr_lws_data:
