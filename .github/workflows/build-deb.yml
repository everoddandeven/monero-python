name: Build Debian Packages

# Builds the package from debian/ with dpkg-buildpackage in a container of each release.
# Pull requests build amd64 on trixie and bookworm. Main also builds amd64 on noble and jammy
# and arm64 on trixie and bookworm. The release (called by release.yml) and the manual runs with
# full build all of them. arm64 and armhf are built natively on arm runners, which run 32 bit
# arm containers.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/build-deb.yml'
      - 'debian/**'
      - 'bin/build_monero_cpp.sh'
      - 'bin/hardening_flags.sh'
      - 'bin/check_elf_hardening.sh'
      - 'CMakeLists.txt'
  workflow_dispatch:
    inputs:
      full:
        description: Build every release and architecture
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        description: Build every release and architecture
        type: boolean
        default: false

# A new push to a pull request cancels the previous run. Other events get their own
# group so they are never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write # replace the ccache entries

jobs:
  build:
    name: ${{ contains('noble jammy', matrix.name) && 'ubuntu' || 'debian' }} (${{ matrix.name }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        name: [noble, jammy, trixie, bookworm]
        arch: [amd64, arm64, armhf]
        # pull requests build amd64 on trixie and bookworm, main adds amd64 on the Ubuntu releases and
        # arm64 on the Debian ones, the tags and the manual runs with full build everything
        exclude: ${{ fromJSON((github.ref_type == 'tag' || inputs.full) && '[]' || (github.event_name == 'pull_request' && '[{"arch":"armhf"},{"arch":"arm64"},{"name":"noble"},{"name":"jammy"}]' || '[{"arch":"armhf"},{"arch":"arm64","name":"noble"},{"arch":"arm64","name":"jammy"}]')) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Determine package version
        id: version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          docker system prune -af || true

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-deb-${{ matrix.name }}-${{ matrix.arch }}
          restore-keys: |
            ccache-deb-${{ matrix.name }}-${{ matrix.arch }}_

      # Installs the Build-Depends of debian/control in the container, sets the version of
      # debian/changelog from pyproject.toml and runs dpkg-buildpackage. The workspace is
      # mounted at /github/workspace in the container.
      - name: Build package
        uses: jtdor/build-deb-action@473136f14a42a231124c1f7cefaedfe941203c38 # v1.9.1
        env:
          CCACHE_DIR: /github/workspace/.ccache
          CCACHE_MAXSIZE: 500M
        with:
          # the image is not in the matrix: an include entry of a release left out by exclude
          # would be a job of its own
          docker-image: ${{ fromJSON('{"noble":"ubuntu:24.04","jammy":"ubuntu:22.04","trixie":"debian:trixie-slim","bookworm":"debian:bookworm-slim"}')[matrix.name] }}
          extra-docker-args: --platform ${{ matrix.arch == 'armhf' && 'linux/arm/v7' || format('linux/{0}', matrix.arch) }}
          before-build-hook: sh debian/set-version.sh ${{ matrix.name }}
          buildpackage-opts: --build=binary --no-sign --jobs=auto

      - name: Save ccache
        # Pull requests only read the cache, pushes to main and manual runs replace it.
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: ./.github/actions/save-ccache
        with:
          key: ccache-deb-${{ matrix.name }}-${{ matrix.arch }}

      - name: Upload deb package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python3-monero_${{ steps.version.outputs.version }}-1${{ matrix.name }}1_${{ matrix.arch }}
          path: debian/artifacts/python3-monero_*.deb

      # the segments and the exports of the module in the package, and the stack protector and the branch protection in its code. The
      # module of the armhf package is read but not disassembled, the objdump of the arm64 runner does not read 32 bit arm.
      # After the upload, so that a package that fails can be downloaded and looked at. The release needs this job to succeed
      - name: Check hardening and exports
        run: |
          dpkg-deb -x debian/artifacts/python3-monero_*.deb deb-check
          bin/check_elf_hardening.sh deb-check/usr/lib/python3/dist-packages/monero*.so
