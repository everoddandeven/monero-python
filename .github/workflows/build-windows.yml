name: Build Windows

# Called by ci.yml, which has the triggers and the concurrency group: a group here would be the one of the caller, and the
# jobs of the same run would cancel each other.
on:
  workflow_call:

permissions:
  contents: read
  actions: write # replace the ccache entries

jobs:
  windows:
    name: windows
    timeout-minutes: 120
    runs-on: windows-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      # the version is in one file: the wheel that CI builds is for it, and the job that tests the wheel needs the same
      - name: Install Python (the version of .github/python-version)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .github/python-version
          architecture: 'x64'

      - name: Install the Python build requirements (requirements-build.txt)
        shell: bash
        run: |
          python -m pip install -r requirements-build.txt

      # unbound is not here: the mingw64 repo dropped it, and the one that the module links comes pinned with OpenSSL, below
      - name: Install MSYS2 and its MINGW64 packages (openssl, zeromq, libsodium and protobuf at the version of the repo)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zeromq
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-protobuf
            mingw-w64-x86_64-ntldd
            mingw-w64-x86_64-ccache
            git
            make
            gettext
            base-devel
            wget

      # the packages, with their sha256, are in bin/msys2_pins.txt
      - name: Install MinGW64 toolchain 16.2.0 (pinned)
        run: |
          # gcc-libs is split into libgcc, libstdc++ and cc-libs since 16.2.0-4 and the
          # new packages conflict with the pinned gcc-libs, so drop them before the downgrade
          for p in libgcc libstdc++ cc-libs; do
            if pacman -Q mingw-w64-x86_64-$p > /dev/null 2>&1; then
              pacman -Rdd --noconfirm mingw-w64-x86_64-$p
            fi
          done
          bin/install_msys2_pins.sh toolchain

      - name: Install ICU 78.3 (pinned)
        run: bin/install_msys2_pins.sh icu

      # dropped from the msys2 mingw64 repo, install the archived packages
      - name: Install hidapi 0.15.0 and libusb 1.0.30 (pinned)
        run: bin/install_msys2_pins.sh hidapi-libusb

      # the version that monero-cpp builds with. The boost-libs in the repo is a newer rebuild that needs the split gcc runtime
      - name: Install boost 1.87.0 (pinned)
        run: bin/install_msys2_pins.sh boost

      - name: Install pybind11 2.13.6 (pinned)
        run: bin/install_msys2_pins.sh pybind11

      # OpenSSL 4 makes X509_get_subject_name() return a const X509_NAME*, which the net_ssl.cpp of monero-project does not build with.
      # The packages of the repo that link to it were rebuilt (-2, -3, -4) and load its DLLs, so they go back with it: unbound and ldns
      # (libunbound.a is linked in the module, and the repo has dropped unbound: this is the only one installed), and the ones that cmake
      # runs with (curl, libarchive, hiredis, libssh2 and ngtcp2), which do not start with OpenSSL 3 otherwise
      - name: Install OpenSSL 3.6.5 and the packages that go with it (pinned)
        run: bin/install_msys2_pins.sh openssl

      - name: Show the versions of the MSYS2 packages
        run: |
          pacman -Q mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils mingw-w64-x86_64-cmake mingw-w64-x86_64-openssl mingw-w64-x86_64-zeromq \
            mingw-w64-x86_64-libsodium mingw-w64-x86_64-unbound mingw-w64-x86_64-protobuf mingw-w64-x86_64-boost mingw-w64-x86_64-icu \
            mingw-w64-x86_64-hidapi mingw-w64-x86_64-libusb mingw-w64-x86_64-pybind11 mingw-w64-x86_64-ccache | bin/job_summary.sh "MSYS2 packages"

      - name: Restore ccache
        uses: ./.github/actions/restore-ccache
        with:
          key: ccache-windows

      - name: Reset ccache statistics
        run: ccache --zero-stats

      - name: Build monero-project (static, Release)
        run: |
          cd external/monero-cpp/external/monero-project
          mkdir -p build/release
          cd build/release
          cmake -G "MSYS Makefiles" \
            -D STATIC=ON \
            -D ARCH="x86-64" \
            -D BUILD_64=ON \
            -D CMAKE_BUILD_TYPE=Release \
            -D BUILD_TAG="win-x64" \
            -D CMAKE_TOOLCHAIN_FILE="../../cmake/64-bit-toolchain.cmake" \
            -D MSYS2_FOLDER=$(cd $MINGW_PREFIX/.. && pwd -W) \
            ../../
            make -j$(nproc) wallet cryptonote_protocol

      - name: Build monero-cpp
        run: |
          cd external/monero-cpp
          mkdir -p build
          cd build
          cmake .. -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build . --parallel $(nproc)

      - name: Build the monero-python wheel
        run: |
          export WIN_PYTHON_EXE=$(cygpath -u "$pythonLocation/python.exe")
          export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
          "$WIN_PYTHON_EXE" -m pip wheel . -w dist --no-build-isolation \
            -C cmake.define.Python3_EXECUTABLE="$WIN_PYTHON_EXE" \
            -C cmake.define.Python3_FIND_STRATEGY=LOCATION \
            -C cmake.define.Python3_FIND_REGISTRY=NEVER

      - name: Show ccache statistics
        if: ${{ !cancelled() }}
        run: ccache --show-stats | bin/job_summary.sh "ccache"

      - name: Save ccache
        # Pull requests only read the cache, pushes to main and manual runs replace it.
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: ./.github/actions/save-ccache
        with:
          key: ccache-windows

      - name: Repair the wheel with delvewheel
        run: |
          export WIN_PYTHON_EXE=$(cygpath -u "$pythonLocation/python.exe")
          MINGW_BIN_WIN=$(cygpath -w "$MINGW_PREFIX/bin")
          "$WIN_PYTHON_EXE" -m delvewheel repair dist/*.whl -w wheelhouse --add-path "$MINGW_BIN_WIN"

      # the flags of the image (ASLR, DEP) and the exports of the module in the wheel that is published
      - name: Check the hardening of the module in the wheel
        run: |
          export WIN_PYTHON_EXE=$(cygpath -u "$pythonLocation/python.exe")
          "$WIN_PYTHON_EXE" -m zipfile -e wheelhouse/*.whl wheel-check
          bash bin/check_pe_hardening.sh wheel-check/monero*.pyd

      - name: Upload the Windows wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-windows-x86_64
          # the default retention: the release downloads it from the run of main, and a tag can come days after the commit
          path: wheelhouse/*.whl
