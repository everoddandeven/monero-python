name: Docs

# Builds the API site from the stubs of src/monero. ci.yml calls it on main, after its coverage job, and the site is published to
# GitHub Pages with the coverage reports of that run in coverage/: every push to main runs CI, so the site is always the one of the
# last commit, with the reports of that commit. Pull requests only build it, to see that it still builds. The site is not kept in
# the repository. To publish it again, re-run the docs job of the CI run of main.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/mkdocs/**'
      - 'src/monero/**'
      - 'docs/architecture.png'
      - 'tests/wallet/wallet_support.yml'
      - '.github/workflows/docs.yml'
  workflow_call:

# A new push to a pull request cancels the previous run. Runs that are not from a pull request get their own group so they are never
# cancelled or replaced. The name is written here and is not github.workflow: when ci.yml calls this workflow, that is "CI", and the group
# would be the one of the run of CI that is calling it.
concurrency:
  group: docs-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/mkdocs/requirements.in

      - name: Install mkdocs and its plugins
        run: pip install -r docs/mkdocs/requirements.in

      # strict, so that a docstring or a reference that does not resolve fails the build
      - name: Build the site
        working-directory: docs/mkdocs
        run: mkdocs build --strict

      # the reports of the coverage job of the CI run that called this workflow, at coverage/, next to the page that links them
      - name: Download the coverage reports
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-reports-linux
          path: coverage-reports

      - name: Add the coverage reports to the site
        if: github.event_name != 'pull_request'
        run: |
          mv coverage-reports/coverage_monero_python_tests_html docs/mkdocs/public/coverage/tests
          mv coverage-reports/coverage_monero_python_bindings_html docs/mkdocs/public/coverage/bindings
          mv coverage-reports/coverage_monero_cpp_html docs/mkdocs/public/coverage/monero-cpp

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/mkdocs/public

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
