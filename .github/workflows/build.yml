name: Build

# The builds are in build-windows.yml and build-macos.yml, called from here, and the tests run on what they built: the wheel
# that a build uploads is the one that its tests install, so nothing is compiled twice.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # Only on pull requests: the release needs a successful run for every commit on main.
    # If Build ever becomes a required check, a skipped run stays Pending and blocks the merge.
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'donate.png'
      - 'docs/**'
      # other workflows, not run by this one
      - '.github/workflows/build-deb.yml'
      - '.github/workflows/codacy.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/lint-workflows.yml'
      - '.github/zizmor.yml'
      - '.github/dependabot.yml'

  workflow_dispatch:

# A new push to a pull request cancels the previous run. Runs that are not
# from a pull request get their own group so they are never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-windows:
    permissions:
      contents: read
      actions: write # build-windows.yml replaces its ccache entries
    uses: ./.github/workflows/build-windows.yml

  build-mac-os:
    permissions:
      contents: read
      actions: write # build-macos.yml replaces its ccache entries
    uses: ./.github/workflows/build-macos.yml

  test-windows:
    name: windows (pytest)
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Download monero-python wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: monero-python-win-amd64
          path: wheelhouse

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install -r tests/requirements.txt
          python -m pip install wheelhouse/*.whl

      - name: Run unit tests
        shell: bash
        env:
          IN_CONTAINER: "true"
        run: |
          python -m pytest -m unit

  test-mac-os:
    name: ${{ matrix.arch }} (pytest)
    needs: build-mac-os
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: mac-arm64
          - os: macos-15-intel
            arch: mac-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download monero-python wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: monero-${{ matrix.os }}
          path: wheelhouse

      - name: Install dependencies
        run: |
          # the python that the build used, the wheel is for its version
          HOMEBREW_NO_AUTO_UPDATE=1 brew install python
          # a virtual environment, as in the build: the python of brew has packages that pip can not replace, and the
          # versions of the requirements file are pinned
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/pip" install -r tests/requirements.txt wheelhouse/*.whl

      - name: Run unit tests
        run: |
          pytest -m unit
