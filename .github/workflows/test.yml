name: 'Tests'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # Only on pull requests: the release needs a successful run for every commit on main.
    # If Tests ever becomes a required check, a skipped run stays Pending and blocks the merge.
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'donate.png'
      - 'docs/**'
      # other workflows, not run by this one (build-*.yml have their own pull_request trigger)
      - '.github/workflows/build-*.yml'
      - '.github/workflows/codacy.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/lint-workflows.yml'
      - '.github/zizmor.yml'
      - '.github/dependabot.yml'

  workflow_dispatch:

# A new push to a pull request cancels the previous run. Runs that are not
# from a pull request get their own group so they are never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write # replace the ccache entries
    name: linux-x86_64 (pytest)
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake pkg-config libssl-dev libzmq3-dev libunbound-dev libsodium-dev libunwind8-dev liblzma-dev libreadline6-dev libexpat1-dev libpgm-dev qttools5-dev-tools libhidapi-dev libusb-1.0-0-dev libprotobuf-dev protobuf-compiler libudev-dev libboost-chrono-dev libboost-date-time-dev libboost-filesystem-dev libboost-locale-dev libboost-program-options-dev libboost-regex-dev libboost-serialization-dev libboost-system-dev libboost-thread-dev python3 ccache doxygen graphviz git curl autoconf libtool gperf nettle-dev libevent-dev debhelper python3-all python3-pip lcov
          pip3 install -r tests/requirements.txt -r requirements-build.txt --break-system-packages

      - name: Install expat
        run: |
          wget https://github.com/libexpat/libexpat/releases/download/R_2_7_1/expat-2.7.1.tar.bz2
          echo "45c98ae1e9b5127325d25186cf8c511fa814078e9efeae7987a574b482b79b3d  expat-2.7.1.tar.bz2" | sha256sum -c
          tar -xf expat-2.7.1.tar.bz2
          cd expat-2.7.1
          ./configure --enable-static --disable-shared --with-pic
          make
          sudo make install
          cd ../

      - name: Install unbound
        run: |
          wget https://www.nlnetlabs.nl/downloads/unbound/unbound-1.22.0.tar.gz
          echo "c5dd1bdef5d5685b2cedb749158dd152c52d44f65529a34ac15cd88d4b1b3d43  unbound-1.22.0.tar.gz" | sha256sum -c
          tar xzf unbound-1.22.0.tar.gz
          cd unbound-1.22.0
          ./configure --with-libexpat=/usr/local --with-ssl=/usr --enable-static --disable-shared --with-pic
          # monero only needs libunbound, skip the daemon and the tools
          make -j"$(nproc)" lib
          sudo make install-lib
          cd ../

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-test
          restore-keys: |
            ccache-linux-test_

      - name: Reset ccache statistics
        run: ccache --zero-stats

      - name: Build monero-project
        run: |
          cd external/monero-cpp/external/monero-project
          mkdir -p build/release
          cd build/release
          # monero builds with -march=native unless it is told which cpu to build for, and objects compiled
          # on a runner with newer instructions, restored by ccache or shipped in a package, end in an illegal
          # instruction on another cpu
          cmake -DSTATIC=ON -DARCH=x86-64 -DBUILD_64=ON -DCMAKE_BUILD_TYPE=Release ../../
          make -j3 wallet cryptonote_protocol
          cd ../../../../../../

      - name: Build monero-cpp libraries
        run: |
          cd external/monero-cpp
          mkdir -p build
          cd build
          cmake .. -DENABLE_COVERAGE=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build .
          make -j3
          cd ../../../

      - name: Build monero-python module
        run: |
          mkdir -p build
          cmake -B build -DENABLE_COVERAGE=ON -Dpybind11_DIR="$(python3 -m pybind11 --cmakedir)"
          cmake --build build
          cp build/monero.cpython-312-x86_64-linux-gnu.so ~/.local/lib/python3.12/site-packages/

      # stubgen, pinned because a new version can report more, reads the signatures that pybind11 writes in
      # the docstrings and fails on what is wrong with the bindings: a C++ type that leaked into one, a default
      # that is only a repr, a parameter with no name. The bindings are the same on every platform.
      - name: Lint the bindings with pybind11-stubgen
        run: python3 bin/lint_bindings.py

      - name: Show ccache statistics
        if: ${{ !cancelled() }}
        run: ccache --show-stats

      - name: Save ccache
        # Pull requests only read the cache, pushes to main and manual runs replace it.
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: ./.github/actions/save-ccache
        with:
          key: ccache-linux-test

      - name: Setup test environment
        run: |
          docker compose -f tests/docker-compose.yml up -d node_1 node_2 xmr_wallet_1 xmr_wallet_2 xmr_wallet_3
          sleep 10

      - name: Reset coverage counters
        run: |
          lcov --directory . --zerocounters

      - name: Run unit & integration tests
        env:
          IN_CONTAINER: "true"
        run: |
          pytest --cov=tests --cov-report=xml

      - name: Dump container logs
        if: always()
        run: |
          mkdir -p container-logs
          for svc in node_1 node_2 xmr_wallet_1 xmr_wallet_2 xmr_wallet_3; do
            docker compose -f tests/docker-compose.yml logs --no-color --timestamps "$svc" > "container-logs/$svc.log" 2>&1 || true
          done

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-logs-linux
          path: container-logs/

      - name: Cleanup test environment
        if: always()
        run: docker compose -f tests/docker-compose.yml down -v

      - name: Upload tests logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs
          path: monero_tests_*.log

      - name: Generate python bindings coverage report
        if: always()
        run: |
          lcov --capture --directory build --ignore-errors mismatch,mismatch,inconsistent,source,source,gcov,gcov --output-file coverage_full.info
          lcov --ignore-errors unused,unused --remove coverage_full.info '/usr/*' '*/external/*' '*/pybind11/*' '*monero-cpp/*' '*monero-project/*' --output-file coverage.info
          sed -i "s|$(pwd)/||g" coverage.info
          genhtml coverage.info --output-directory coverage_monero_python_bindings_html --ignore-errors mismatch,inconsistent,source,corrupt --title "monero-python bindings coverage @ ${GITHUB_SHA::7}"
          lcov --summary coverage.info

      - name: Generate python tests coverage report
        if: always()
        run: |
          coverage html -d coverage_monero_python_tests_html --title "monero-python tests coverage @ ${GITHUB_SHA::7}"

      - name: Generate monero-cpp coverage report
        if: always()
        run: |
          lcov --capture --directory external/monero-cpp/build --directory build --ignore-errors mismatch,mismatch,inconsistent,source,source,gcov,gcov --output-file coverage_monero_cpp_full.info
          lcov --ignore-errors unused,unused --extract coverage_monero_cpp_full.info '*/monero-cpp/src/*' --output-file coverage_monero_cpp.info
          sed -i "s|$(pwd)/||g" coverage_monero_cpp.info
          genhtml coverage_monero_cpp.info --output-directory coverage_monero_cpp_html --ignore-errors mismatch,inconsistent,source,corrupt --title "monero-cpp coverage @ ${GITHUB_SHA::7}"
          lcov --summary coverage_monero_cpp.info

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports-linux
          path: |
            coverage.info
            coverage.xml
            coverage_monero_cpp.info
            coverage_monero_cpp_html/
            coverage_monero_python_bindings_html/
            coverage_monero_python_tests_html/
