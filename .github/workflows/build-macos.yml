name: Build macOS

# Called by ci.yml, which has the triggers and the concurrency group: a group here would be the one of the caller, and the
# jobs of the same run would cancel each other.
on:
  workflow_call:

permissions:
  contents: read
  actions: write # replace the ccache entries

jobs:
  mac-os:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: "%compiler% -v"

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: mac-arm64
          - os: macos-15-intel
            arch: mac-x86_64

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive

    - name: Install brew formulae (boost@1.85, openssl@3 and the other libraries)
      run: |
        HOMEBREW_NO_AUTO_UPDATE=1 brew install python boost@1.85 hidapi openssl@3 zmq libpgm miniupnpc expat libunwind-headers protobuf ccache
        # the image of the runner can have another boost linked, which gets in the way of boost@1.85. They are touched only when
        # they are there, brew prints an error for a formula that is not installed (the annotations of the run show it as one)
        if brew list --versions boost > /dev/null 2>&1; then
          brew unlink boost
          brew link boost@1.85 --force
        fi
        # brew links openssl@4 into /opt/homebrew, and the -I/opt/homebrew/include of boost and zeromq comes
        # before the one of openssl@3, so its headers win over the ones of OPENSSL_ROOT_DIR
        if brew list --versions openssl@4 > /dev/null 2>&1; then
          brew unlink openssl@4
        fi
        # brew's openssl is OpenSSL 4 on the newer runner images, which boost 1.85 does not build with.
        # monero-project and monero-cpp take brew's openssl unless they are given another one, so
        # they get it on the command line, and the module finds it in the environment
        echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

    - name: Show the versions of the brew formulae
      run: |
        brew list --versions python boost@1.85 hidapi openssl@3 zmq libpgm miniupnpc expat libunwind-headers protobuf ccache
        cmake --version | head -n 1
        clang --version | head -n 1

    - name: Create the Python virtual environment and install the build requirements (requirements-build.txt)
      run: |
        # a virtual environment: the python of brew has packages that pip can not replace, such as wheel and typing_extensions on the
        # Intel runner (they have no RECORD file), and the versions of the requirements files are pinned. The next steps find it first in the PATH
        python3 -m venv "$RUNNER_TEMP/venv"
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/venv/bin/pip" install -r requirements-build.txt

    # static, against openssl@3: the unbound of brew is built with OpenSSL 4
    - name: Install unbound 1.22.0 (static)
      run: bin/install_unbound_macos.sh

    - name: Restore ccache
      uses: ./.github/actions/restore-ccache
      with:
        key: ccache-${{ matrix.os }}

    - name: Reset ccache statistics
      run: ccache --zero-stats

    - name: Build monero-project (static, Release)
      run: |
        cd external/monero-cpp/external/monero-project
        mkdir -p build/release
        cd build/release
        # monero builds with -march=native unless it is told which cpu to build for, and objects compiled
        # on a runner with newer instructions, restored by ccache or shipped in a package, end in an illegal
        # instruction on another cpu
        ARCH=$([ "$(uname -m)" = x86_64 ] && echo x86-64 || echo armv8-a)
        cmake -DSTATIC=ON -DARCH="$ARCH" -DBUILD_64=ON -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" ../../
        make -j3 wallet cryptonote_protocol
        cd ../../../../../../

    - name: Build monero-cpp
      run: |
        cd external/monero-cpp
        mkdir -p build
        cd build
        cmake .. -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        cmake --build .
        make -j3
        cd ../../../

    - name: Build the monero-python wheel
      run: |
        mkdir -p build
        python3 -m pip wheel . -w dist --no-build-isolation

    - name: Show ccache statistics
      if: ${{ !cancelled() }}
      run: ccache --show-stats

    - name: Save ccache
      # Pull requests only read the cache, pushes to main and manual runs replace it.
      if: ${{ !cancelled() && github.event_name != 'pull_request' }}
      uses: ./.github/actions/save-ccache
      with:
        key: ccache-${{ matrix.os }}

    - name: Repair the wheel with delocate
      run: |
        delocate-wheel -w wheelhouse -v dist/*.whl

    # the canary and the exports of the module in the wheel that is published
    - name: Check the hardening of the module in the wheel
      run: |
        python3 -m zipfile -e wheelhouse/*.whl wheel-check
        bin/check_macho_hardening.sh wheel-check/monero*.so

    - name: Upload the macOS wheel
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: wheel-${{ matrix.arch }}
        # the default retention: the release downloads it from the run of main, and a tag can come days after the commit
        path: wheelhouse/*.whl
