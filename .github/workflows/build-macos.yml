name: Build MacOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:
  workflow_call:

# A new push to a pull request cancels the previous run. Other events get their own
# group so they are never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: "%compiler% -v"

    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-15-intel]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        HOMEBREW_NO_AUTO_UPDATE=1 brew install python boost@1.85 hidapi openssl zmq libpgm miniupnpc expat libunwind-headers protobuf unbound ccache
        brew unlink boost || true
        brew link boost@1.85 --force
        pip3 install pytest pytest-cov setuptools wheel scikit-build-core --break-system-packages

    - name: Install pybind11 v2.13.6
      run: |
        pip3 install pybind11==2.13.6 pybind11-stubgen --break-system-packages

    - name: Install delocate
      run: |
        pip3 install delocate --break-system-packages

    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: .ccache
        key: ccache-${{ matrix.os }}_${{ github.sha }}
        restore-keys: |
          ccache-${{ matrix.os }}_

    - name: Reset ccache statistics
      run: ccache --zero-stats

    - name: Build monero
      run: |
        cd external/monero-cpp/external/monero-project
        mkdir -p build/release
        cd build/release
        cmake -DSTATIC=ON -DBUILD_64=ON -DCMAKE_BUILD_TYPE=Release ../../
        make -j3 wallet cryptonote_protocol
        cd ../../../../../../

    - name: Build monero-cpp
      run: |
        cd external/monero-cpp
        mkdir -p build
        cd build
        cmake .. -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        cmake --build .
        make -j3
        cd ../../../

    - name: Build monero-python
      run: |
        mkdir -p build
        python3 -m pip wheel . -w dist --no-build-isolation

    - name: Show ccache statistics
      if: ${{ !cancelled() }}
      run: ccache --show-stats

    - name: Save ccache
      # Pull requests only read the cache, pushes to main and manual runs populate it.
      if: ${{ !cancelled() && github.event_name != 'pull_request' }}
      uses: actions/cache/save@v4
      with:
        path: .ccache
        key: ccache-${{ matrix.os }}_${{ github.sha }}

    - name: Repair wheel with delocate
      run: |
        delocate-wheel -w wheelhouse -v dist/*.whl

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: monero-${{ matrix.os }}
        path: wheelhouse/*.whl
