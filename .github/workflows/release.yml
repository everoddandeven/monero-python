name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

jobs:
  # the macos and windows builds, the tests and the coverage are those of the Build run of main, the deb ones are built here
  check:
    name: Check the tag and the builds of main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_run_id: ${{ steps.find_run.outputs.build_run_id }}

    steps:
      - name: Check the tag against the version in pyproject.toml
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/${GITHUB_REPOSITORY}/contents/pyproject.toml?ref=${GITHUB_SHA}" \
            | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n1)
          if [ -z "$version" ]; then
            echo "::error::Could not read the version from pyproject.toml at ${GITHUB_SHA}."
            exit 1
          fi
          if [ "v$version" != "$TAG" ]; then
            echo "::error::The tag $TAG does not match the version $version in pyproject.toml. Bump the version before tagging."
            exit 1
          fi

      # a successful run is one in which every build and every test passed
      - name: Find the main-branch Build run for this commit
        id: find_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "${{ github.repository }}" --workflow build.yml \
            --branch main --status success --limit 200 --json databaseId,headSha \
            --jq ".[] | select(.headSha == \"${{ github.sha }}\") | .databaseId" | head -n1)
          if [ -z "$run_id" ]; then
            echo "::error::No successful Build run on main for commit ${{ github.sha }}. Push to main and wait for it to build and pass before tagging."
            exit 1
          fi
          echo "build_run_id=${run_id}" >> "$GITHUB_OUTPUT"

  # every release and architecture, the builds of main only have some of them
  deb:
    name: Build the deb packages
    needs: check
    uses: ./.github/workflows/build-deb.yml
    permissions:
      contents: read
      actions: write # build-deb.yml replaces its ccache entries
    with:
      full: true

  release:
    name: Publish draft release
    needs: [check, deb]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write

    steps:
      - name: Download deb packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python3-monero_*
          path: release-assets
          merge-multiple: true

      - name: Download macos wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.check.outputs.build_run_id }}
          pattern: monero-macos-*
          path: release-assets
          merge-multiple: true

      - name: Download windows wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.check.outputs.build_run_id }}
          name: monero-python-win-amd64
          path: release-assets
          merge-multiple: true

      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.check.outputs.build_run_id }}
          name: coverage-reports-linux
          path: coverage-report

      - name: Zip coverage HTML report
        working-directory: coverage-report
        run: |
          mkdir -p ../release-assets
          zip -r ../release-assets/coverage_monero_cpp_html.zip coverage_monero_cpp_html

      # to check a download against what the workflow published: sha256sum -c SHA256SUMS
      - name: Checksum the assets
        working-directory: release-assets
        run: sha256sum -- *.deb *.whl *.zip > SHA256SUMS

      # lets anyone check an asset against this workflow: gh attestation verify <asset> --repo libmonero/monero-python
      - name: Attest the assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$TAG" \
            --generate-notes \
            release-assets/*.deb release-assets/*.whl release-assets/*.zip release-assets/SHA256SUMS
