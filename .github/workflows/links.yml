name: Links

# lychee on the links to the web of the docs, the docstrings of the stubs and README.md, once a week: a page that moved or went away fails
# the run, and its summary has the report. The links between the pages of the site are checked by its build (docs.yml). The run is
# ./bin/check_links.sh, which has the version of lychee and the files that it checks; the configuration of lychee is lychee.toml.
on:
  schedule:
    - cron: '23 5 * * 1'    # every Monday
  pull_request:
    branches: [ main ]
    paths:
      - 'lychee.toml'
      - 'bin/check_links.sh'
      - '.github/workflows/links.yml'
  workflow_dispatch:

# A new push to a pull request cancels the previous run. Other events get their own
# group so they are never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lychee:
    name: lychee
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the token of the run, for the links to GitHub, which answers fewer requests without one
      - name: Check the links
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./bin/check_links.sh
