version: 2
updates:
  # The actions of the workflows are pinned to a commit, with the version in a comment. Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # let a new release settle for a week before proposing it
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  # The versions of the tools that build the module, in requirements-build.txt. pybind11 stays at 2.x. One pull request for all of them.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    # pybind11 stays at 2.x, and pybind11-stubgen at the version that bin/lint_bindings.py is made for. cmake is only the lowest version that
    # the build asks for in pyproject.toml, and a bump of it would make the module build with nothing older
    ignore:
      - dependency-name: pybind11
        update-types: ["version-update:semver-major"]
      - dependency-name: pybind11-stubgen
        update-types: ["version-update:semver-major"]
      - dependency-name: cmake
    groups:
      build:
        patterns:
          - "*"

  # The versions of the tools that run the tests, in tests/requirements.txt. One pull request for all of them.
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: test
    groups:
      tests:
        patterns:
          - "*"

  # The versions of the tools that build the site, in docs/mkdocs/requirements.in. One pull request for the tools that
  # have to move together (mkdocstrings needs matching versions of autorefs, griffe and pymdown-extensions) and one
  # for the rest. The Docs workflow builds the site with --strict and fails on an update that does not work.
  - package-ecosystem: pip
    directory: /docs/mkdocs
    schedule:
      interval: weekly
    # let a new release settle for a week before proposing it
    cooldown:
      default-days: 7
    commit-message:
      prefix: docs
    groups:
      # first match wins, so this group has to come before the catch-all one
      mkdocstrings:
        patterns:
          - "mkdocstrings*"
          - "mkdocs-autorefs"
          - "griffe*"
          - "pymdown-extensions"
      docs:
        patterns:
          - "*"
