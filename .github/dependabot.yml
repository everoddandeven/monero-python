version: 2
updates:
  # The actions of the workflows are pinned to a commit, with the version in a comment. Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # The versions of the tools that build the site, in docs/mkdocs/requirements.in. One pull request for all of them,
  # the Docs workflow builds the site with --strict and fails on an update that does not work.
  - package-ecosystem: pip
    directory: /docs/mkdocs
    schedule:
      interval: weekly
    commit-message:
      prefix: docs
    groups:
      docs:
        patterns:
          - "*"
